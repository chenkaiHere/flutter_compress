name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with pubspec.yaml's `flutter:` constraint.
  FLUTTER_VERSION: 3.44.5

jobs:
  # Fast feedback: format, analyze, test. Ordered cheapest-first.
  dart:
    name: format / analyze / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos so the warning count can't creep upward.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # The CLAUDE.md checks that are cheap enough to run on every push. Each one
  # corresponds to a bug that previously reached master.
  guards:
    name: spec guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tool/guards.sh

  android:
    name: android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Kotlin lint
        # ktlint via its CLI: no Gradle plugin needed, and it can't drift from
        # the build config. Must run from the repo root — ktlint resolves globs
        # against the working directory, and a `../..` prefix makes it walk far
        # outside the project. Rules are configured in .editorconfig.
        run: |
          curl -sSL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.3.1/ktlint
          chmod +x ktlint
          ./ktlint --relative "android/src/**/*.kt"

      - name: Build example APK
        working-directory: example
        run: flutter build apk --debug

      - name: Unit tests (JVM)
        working-directory: example/android
        run: ./gradlew :flutter_compress:testDebugUnitTest

  ios:
    name: ios build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: SwiftLint
        # Preinstalled on the current macOS images, but don't bet the job on it
        # — that assumption is exactly what broke the Gradle step.
        run: |
          command -v swiftlint >/dev/null || brew install swiftlint
          swiftlint --strict --config .swiftlint.yml

      # This is the gate that would have caught a call to a method that doesn't
      # exist on the engine — swiftc alone can't check the plugin file, because
      # it imports Flutter.
      - name: Build example (no codesign)
        working-directory: example
        run: flutter build ios --no-codesign --debug

  web:
    name: web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: example
        run: flutter build web

  publish-dry-run:
    name: pub publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Catches packaging mistakes (a stray directory getting published, a
      # too-long description) before they reach pub.dev.
      - run: flutter pub publish --dry-run
